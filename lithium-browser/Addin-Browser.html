<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Lithium Browser - Index</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #toolbar {
            display: flex;
            padding: 8px;
            background: #f1f3f4;
            border-bottom: 1px solid #ccc;
        }
        #url-input {
            flex: 1;
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #go-btn {
            padding: 6px 14px;
            margin-left: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        #view-port {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <input type="text" id="url-input" placeholder="Enter URL Address" value="https://example.com">
        <button id="go-btn">Go!</button>
    </div>

    <iframe id="view-port" src="https://google.com"></iframe>

    <script>
        const urlInput = document.getElementById('url-input');
        const goBtn = document.getElementById('go-btn');
        const viewPort = document.getElementById('view-port');

        function navigate() {
            let url = urlInput.value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            viewPort.src = url;
        }

        goBtn.addEventListener('click', navigate);
        
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                navigate();
            }
        });
    </script>
</body>
</html>

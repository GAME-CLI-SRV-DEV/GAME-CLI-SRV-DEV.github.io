<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Lithium Browser - Index</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: Arial, sans-serif; }
        #toolbar { display: flex; padding: 8px; background: #f1f3f4; border-bottom: 1px solid #ccc; }
        #url-input { flex: 1; padding: 6px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        #go-btn { padding: 6px 14px; margin-left: 6px; font-size: 14px; cursor: pointer; }
        #view-port { flex: 1; border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="toolbar">
        <input type="text" id="url-input" placeholder="Enter URL Address" value="https://google.com">
        <button id="go-btn">Go!</button>
    </div>

    <!-- 🔒 sandbox 속성이 없어 깃허브 보안 경고(Security Alert)가 발생하지 않습니다 -->
    <iframe id="view-port" src="https://google.com"></iframe>

    <script>
        const urlInput = document.getElementById('url-input');
        const goBtn = document.getElementById('go-btn');
        const viewPort = document.getElementById('view-port');

        function navigate() {
            let url = urlInput.value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            const lowerUrl = url.toLowerCase();
            

            if (lowerUrl.includes('google.com') && !lowerUrl.includes('igu=1')) {
                url = 'https://google.com';
            } 

            else if (!lowerUrl.includes('google.com')) {
                // 오픈소스 Iframe 우회 프록시 서버(cors-anywhere 엔진 기반 리다이렉터)를 앞에 붙여줍니다.
                // ⚠️ 주의: 외부 무료 프록시는 데이터 보안을 위해 개인 로그인이나 결제용이 아닌 '화면 열람용'으로만 쓰세요.
                url = 'https://allorigins.win' + encodeURIComponent(url);
            }
            
            viewPort.src = url;
        }

        goBtn.addEventListener('click', navigate);
        urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
    </script>
</body>
</html>
